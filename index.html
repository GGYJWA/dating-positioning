<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>相亲市场定位测试 · 嘀嗒老师版</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <!-- 所有屏幕由 JS 渲染 -->
</div>

<script src="engine.js"></script>
<script src="qrcode.js"></script>
<script>
(function () {
  const E = window.DatingEngine;
  const app = document.getElementById('app');

  /* ---------- 状态 ---------- */
  const state = {
    gender: null,          // 'female' | 'male'
    step: 0,               // 0=开场, 1..9=答题, 10=加载, 11=结果
    answers: {},           // 各题答案
  };

  /* ---------- 工具 ---------- */
  const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ---------- 开场屏 ---------- */
  function renderIntro() {
    const node = el(`
      <section class="screen intro">
        <div class="hero">
          <div class="hero-badge">💝 嘀嗒老师 · 本地计算版</div>
          <h1 class="hero-title">相亲市场<br/>定位测试</h1>
          <p class="hero-sub">基于 9 个维度，帮你找到真实的相亲市场坐标</p>
        </div>

        <div class="tags">
          <span class="tag">📊 9 大维度</span>
          <span class="tag">🎯 双画像匹配</span>
          <span class="tag">💬 详细解析</span>
        </div>

        <div class="card privacy">
          <span class="lock">🔒</span>
          <p>你填写的所有信息<b>仅在本地计算使用</b>，不上传任何服务器，不存储任何个人数据，请放心作答。</p>
        </div>

        <div class="card notice">
          <p>测试共 <b>9 个维度</b>，约需 <b>5 分钟</b>。结果将给出你的相亲市场定位，以及专属的<b>「底线型」&amp;「理想型」双画像</b>。</p>
        </div>

        <div class="gender-pick">
          <p class="q-label">你的性别</p>
          <div class="gender-row">
            <button class="gender-btn" data-g="female">👩 女生</button>
            <button class="gender-btn" data-g="male">👨 男生</button>
          </div>
        </div>

        <button class="primary-btn" id="startBtn" disabled>开始测试 →</button>
        <p class="foot-note">本测试为趣味自我认知工具，结果仅供娱乐与参考。</p>
      </section>
    `);
    node.querySelectorAll('.gender-btn').forEach(b => {
      b.addEventListener('click', () => {
        state.gender = b.dataset.g;
        node.querySelectorAll('.gender-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        node.querySelector('#startBtn').disabled = false;
      });
    });
    node.querySelector('#startBtn').addEventListener('click', () => { state.step = 1; render(); });
    return node;
  }

  /* ---------- 答题屏 ---------- */
  function renderQuiz() {
    const idx = state.step - 1;
    const step = E.QUESTIONS[idx];
    const pct = Math.round((state.step / 9) * 100);

    const qHtml = step.questions.map(q => {
      if (q.type === 'number') {
        const saved = state.answers[q.id];
        return `
          <div class="question" data-q="${q.id}" data-type="number">
            <p class="q-label">${esc(q.label)}</p>
            ${q.hint ? `<p class="q-hint">${esc(q.hint)}</p>` : ''}
            <input class="num-input" type="number" inputmode="numeric" placeholder="${esc(q.placeholder||'')}" value="${saved?esc(saved.value):''}" />
            <span class="unit">${esc(q.unit||'')}</span>
          </div>`;
      }
      if (q.type === 'multi') {
        const saved = state.answers[q.id] || [];
        const opts = q.options.map(o => {
          const on = saved.some(s => s.value === o.value);
          return `<button class="opt multi ${on?'active':''}" data-v="${esc(o.value)}" data-label="${esc(o.label)}">${esc(o.label)}</button>`;
        }).join('');
        return `
          <div class="question" data-q="${q.id}" data-type="multi">
            <p class="q-label">${esc(q.label)}</p>
            <div class="opts multi-wrap">${opts}</div>
          </div>`;
      }
      const saved = state.answers[q.id];
      const opts = q.options.map(o => {
        const on = saved && saved.value === o.value;
        return `<button class="opt ${on?'active':''}" data-v="${esc(o.value)}" data-label="${esc(o.label)}" data-score="${o.s}" data-tier="${o.tier!=null?o.tier:''}" data-idx="${q.options.indexOf(o)}">${esc(o.label)}</button>`;
      }).join('');
      return `
        <div class="question" data-q="${q.id}" data-type="single">
          <p class="q-label">${esc(q.label)}</p>
          <div class="opts">${opts}</div>
        </div>`;
    }).join('');

    const isLast = state.step === 9;
    const node = el(`
      <section class="screen quiz">
        <div class="progress-wrap">
          <div class="progress-top">
            <span class="module">${esc(step.title)}</span>
            <span class="counter">${state.step} / 9</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <p class="subtitle">## ${esc(step.subtitle)}</p>
        </div>
        <div class="quiz-body">${qHtml}</div>
        <div class="nav-row">
          <button class="ghost-btn" id="backBtn">${state.step===1?'← 返回':'← 返回'}</button>
          <button class="primary-btn flex1" id="nextBtn">${isLast?'查看我的相亲定位 ✨':'下一步 →'}</button>
        </div>
      </section>
    `);

    // 单选
    node.querySelectorAll('.question[data-type="single"] .opt').forEach(b => {
      b.addEventListener('click', () => {
        const q = b.closest('.question');
        q.querySelectorAll('.opt').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        state.answers[b.closest('.question').dataset.q] = {
          value: b.dataset.v, label: b.dataset.label,
          score: Number(b.dataset.score),
          tier: b.dataset.tier === '' ? undefined : Number(b.dataset.tier),
          idx: Number(b.dataset.idx),
        };
      });
    });
    // 多选
    node.querySelectorAll('.question[data-type="multi"] .opt').forEach(b => {
      b.addEventListener('click', () => {
        const qid = b.closest('.question').dataset.q;
        const arr = state.answers[qid] || [];
        if (b.classList.contains('active')) {
          b.classList.remove('active');
          state.answers[qid] = arr.filter(s => s.value !== b.dataset.v);
        } else {
          b.classList.add('active');
          arr.push({ value: b.dataset.v, label: b.dataset.label });
          state.answers[qid] = arr;
        }
      });
    });
    // 数值
    node.querySelectorAll('.question[data-type="number"] input').forEach(inp => {
      inp.addEventListener('input', () => {
        const q = inp.closest('.question');
        const qid = q.dataset.q;
        const v = inp.value.trim();
        const conf = E.QUESTIONS.flatMap(s => s.questions).find(x => x.id === qid);
        const score = conf.id === 'age' ? E.ageScore(v) : E.heightScore(state.gender, v);
        state.answers[qid] = { value: v, score };
      });
    });

    node.querySelector('#backBtn').addEventListener('click', () => {
      if (state.step === 1) { state.step = 0; } else { state.step--; }
      render();
    });
    node.querySelector('#nextBtn').addEventListener('click', () => {
      if (!validateStep(step)) {
        toast('还有题目没填完哦～');
        return;
      }
      if (isLast) { state.step = 10; render(); runCompute(); }
      else { state.step++; render(); window.scrollTo(0,0); }
    });

    return node;
  }

  function validateStep(step) {
    for (const q of step.questions) {
      const a = state.answers[q.id];
      if (q.type === 'multi') { if (!a || a.length === 0) return false; }
      else if (q.type === 'number') { if (!a || a.value === '' || a.value == null) return false; }
      else { if (!a) return false; }
    }
    return true;
  }

  /* ---------- 加载屏 ---------- */
  function renderLoading() {
    return el(`
      <section class="screen loading">
        <div class="crystal">🔮</div>
        <h2>正在分析你的数据</h2>
        <p class="loading-sub">综合 9 个维度，生成专属双画像…</p>
        <div class="dots"><span></span><span></span><span></span></div>
      </section>
    `);
  }

  function runCompute() {
    setTimeout(() => {
      state.answers.gender = state.gender; // 把性别传入引擎，否则结果页始终显示「女生」
      const scores = E.computeScores(state.answers);
      const portrait = E.generatePortrait(state.answers, scores);
      state.result = { scores, portrait };
      state.step = 11;
      render();
      window.scrollTo(0, 0);
    }, 1600);
  }

  /* ---------- 结果屏 ---------- */
  function renderResult() {
    const { scores, portrait } = state.result;
    const t = portrait.tier;
    const dims = scores.dims;

    function bar(name, val) {
      return `<div class="dim-row"><span class="dim-name">${name}</span>
        <div class="dim-bar"><div class="dim-fill" style="width:${val}%"></div></div>
        <span class="dim-val">${val}</span></div>`;
    }

    const tipsHtml = portrait.tips.map(x => `<li>${esc(x)}</li>`).join('');

    const node = el(`
      <section class="screen result">
        <div class="share-card">
          <div class="sc-head">
            <span class="sc-badge">💝 相亲市场定位</span>
            <span class="sc-gender">${esc(portrait.genderText)}</span>
          </div>
          <div class="sc-tier">${t.emoji} ${esc(t.name)}</div>
          <div class="sc-tagline">${esc(t.tagline)}</div>
          <div class="sc-score">综合竞争力 <b>${scores.total}</b><span>/100</span></div>
          <div class="sc-bars">
            ${bar('硬实力', dims.hard)}
            ${bar('软实力', dims.soft)}
            ${bar('家庭支持', dims.family)}
            ${bar('主动性', dims.active)}
          </div>
        </div>

        <div class="card portrait-block">
          <h3>🛡️ 底线型 · 你的安全区</h3>
          <p class="pb-desc">这是你能长期舒服相处的最低线，再低就会内耗。</p>
          <ul class="pb-list">
            <li>城市：<b>${esc(portrait.floor.city)}</b> 及以上</li>
            <li>学历：<b>${esc(portrait.floor.edu)}</b> 及以上</li>
            <li>月收入：<b>${esc(portrait.floor.income)}</b> 及以上</li>
            <li>颜值：<b>${esc(portrait.floor.look)}</b> 及以上</li>
          </ul>
        </div>

        <div class="card portrait-block ideal">
          <h3>🌟 理想型 · 你的天花板</h3>
          <p class="pb-desc">踮脚能够到的区间，不是白日梦，是「努力一下够得着」。</p>
          <ul class="pb-list">
            <li>城市：<b>${esc(portrait.ideal.city)}</b></li>
            <li>学历：<b>${esc(portrait.ideal.edu)}</b></li>
            <li>月收入：<b>${esc(portrait.ideal.income)}</b></li>
            <li>颜值：<b>${esc(portrait.ideal.look)}</b></li>
          </ul>
        </div>

        <div class="card analysis">
          <h3>🔍 详细解析</h3>
          <p>${esc(portrait.analysis)}</p>
          <ul class="tips">${tipsHtml}</ul>
        </div>

        <div class="result-actions">
          <button class="primary-btn" id="retryBtn">↻ 重新测试</button>
          <button class="ghost-btn" id="shotBtn">📸 截图保存分享</button>
        </div>
        <p class="foot-note">结果由本地算法生成，仅供参考与娱乐。你的数据从未离开这台设备。</p>
      </section>
    `);

    node.querySelector('#retryBtn').addEventListener('click', () => {
      state.step = 0; state.answers = {}; state.result = null; render(); window.scrollTo(0,0);
    });
    node.querySelector('#shotBtn').addEventListener('click', generateShareImage);
    return node;
  }

  /* ---------- 分享图（原生 Canvas 绘制 + 二维码，纯本地）---------- */
  const SHARE_URL = 'https://GGYJWA.github.io/dating-positioning/';

  function roundRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function buildShareDataURL() {
    const { scores, portrait } = state.result;
    const t = portrait.tier;
    const dims = scores.dims;
    const W = 1080, P = 64, cardW = W - 2 * P;
    const F = '-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';

    const tmp = document.createElement('canvas');
    tmp.width = W; tmp.height = 2600;
    const ctx = tmp.getContext('2d');

    // 背景
    const bg = ctx.createLinearGradient(0, 0, 0, tmp.height);
    bg.addColorStop(0, '#ffe9ee'); bg.addColorStop(0.4, '#fff5f7'); bg.addColorStop(1, '#ffffff');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, tmp.height);

    let y = 70;
    // 头部
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#ff2442'; ctx.font = '700 32px ' + F;
    ctx.fillText('💝 嘀嗒老师 · 相亲市场定位', P, y);
    y += 50;
    ctx.fillStyle = '#2b2b2b'; ctx.font = '800 58px ' + F;
    ctx.fillText('你的相亲市场定位结果', P, y);
    y += 96;

    // 主卡（高度按 CJK 字宽≈字号解析估算）
    const pad = 44;
    const innerMax = cardW - 2 * pad;
    const perLine = Math.max(1, Math.floor((innerMax - 96) / 30));
    const tagLines = Math.max(1, Math.ceil(t.tagline.length / perLine));
    const tagH = tagLines * 42 + 14;
    const cardH = 96 + tagH + 150 + 4 * 56 + 2 * pad;
    const cardX = P, cardY = y;

    ctx.fillStyle = '#ffffff'; roundRect(ctx, cardX, cardY, cardW, cardH, 28); ctx.fill();
    ctx.strokeStyle = '#ffe0e6'; ctx.lineWidth = 2; roundRect(ctx, cardX, cardY, cardW, cardH, 28); ctx.stroke();

    let iy = cardY + pad;
    // emoji + 名称
    ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    ctx.font = '72px ' + F; ctx.fillText(t.emoji, cardX + pad, iy);
    ctx.fillStyle = '#2b2b2b'; ctx.font = '800 56px ' + F;
    ctx.fillText(t.name, cardX + pad + 96, iy + 8);
    iy += 96;
    // 标语
    ctx.fillStyle = '#555'; ctx.font = '30px ' + F;
    for (let k = 0; k < tagLines; k++) {
      ctx.fillText(t.tagline.slice(k * perLine, (k + 1) * perLine), cardX + pad, iy);
      iy += 42;
    }
    iy += 14;
    // 综合分
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#8a8a8a'; ctx.font = '30px ' + F;
    ctx.fillText('综合竞争力', cardX + pad, iy + 34);
    ctx.fillStyle = '#ff2442'; ctx.font = '800 96px ' + F;
    ctx.fillText(String(scores.total), cardX + pad, iy + 128);
    const numW = ctx.measureText(String(scores.total)).width;
    ctx.fillStyle = '#8a8a8a'; ctx.font = '30px ' + F;
    ctx.fillText('/100', cardX + pad + numW + 12, iy + 128);
    iy += 150;
    // 四维条
    const bars = [['硬实力', dims.hard], ['软实力', dims.soft], ['家庭支持', dims.family], ['主动性', dims.active]];
    const labelW = 130, barMax = cardW - 2 * pad - labelW - 70;
    bars.forEach(function (b) {
      const nm = b[0], val = b[1];
      ctx.fillStyle = '#555'; ctx.font = '30px ' + F; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      ctx.fillText(nm, cardX + pad, iy + 22);
      const bx = cardX + pad + labelW, by = iy + 8;
      ctx.fillStyle = '#ffe0e6'; roundRect(ctx, bx, by, barMax, 28, 14); ctx.fill();
      const fw = Math.max(0, Math.min(1, val / 100)) * barMax;
      if (fw > 0) {
        const g = ctx.createLinearGradient(bx, 0, bx + barMax, 0);
        g.addColorStop(0, '#ff2442'); g.addColorStop(1, '#ff6680');
        ctx.fillStyle = g; roundRect(ctx, bx, by, fw, 28, 14); ctx.fill();
      }
      ctx.fillStyle = '#ff2442'; ctx.font = '700 30px ' + F; ctx.textAlign = 'right';
      ctx.fillText(String(val), cardX + cardW - pad, iy + 22);
      iy += 56;
    });

    // 双画像
    y = cardY + cardH + 28;
    const colGap = 24, colW = (cardW - colGap) / 2;
    const cols = [
      { title: '🛡️ 底线型 · 安全区', sub: '再低就会内耗', data: portrait.floor, gold: false },
      { title: '🌟 理想型 · 天花板', sub: '踮脚够得着', data: portrait.ideal, gold: true },
    ];
    const rowDefs = [['城市', 'city'], ['学历', 'edu'], ['月收入', 'income'], ['颜值', 'look']];
    const colH = 28 + 52 + 4 * 56 + 28;
    cols.forEach(function (col, ci) {
      const cx = P + ci * (colW + colGap);
      ctx.fillStyle = '#ffffff'; roundRect(ctx, cx, y, colW, colH, 22); ctx.fill();
      ctx.strokeStyle = '#ffe0e6'; ctx.lineWidth = 2; roundRect(ctx, cx, y, colW, colH, 22); ctx.stroke();
      let cy = y + 28;
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillStyle = col.gold ? '#ffb648' : '#ff2442'; ctx.font = '700 34px ' + F;
      ctx.fillText(col.title, cx + 28, cy); cy += 46;
      ctx.fillStyle = '#999'; ctx.font = '24px ' + F;
      ctx.fillText(col.sub, cx + 28, cy); cy += 40;
      rowDefs.forEach(function (r) {
        ctx.fillStyle = '#555'; ctx.font = '30px ' + F; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
        ctx.fillText(r[0], cx + 28, cy + 22);
        ctx.fillStyle = '#2b2b2b'; ctx.font = '700 32px ' + F; ctx.textAlign = 'right';
        ctx.fillText(col.data[r[1]], cx + colW - 28, cy + 22);
        ctx.strokeStyle = '#ffe0e6'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(cx + 28, cy + 44); ctx.lineTo(cx + colW - 28, cy + 44); ctx.stroke();
        cy += 56;
      });
    });

    // 底部二维码卡
    let fy = y + colH + 28;
    const qr = qrcode(0, 'M'); qr.addData(SHARE_URL); qr.make();
    const count = qr.getModuleCount(); const qrCell = 8; const qrSize = count * qrCell;
    const fH = Math.max(360, qrSize + 64);
    const fpad = 36;
    ctx.fillStyle = '#ffffff'; roundRect(ctx, P, fy, cardW, fH, 22); ctx.fill();
    ctx.strokeStyle = '#ffe0e6'; ctx.lineWidth = 2; roundRect(ctx, P, fy, cardW, fH, 22); ctx.stroke();
    // 二维码（品牌红模块）
    const qx = P + fpad, qy = fy + fpad;
    ctx.fillStyle = '#ffffff'; roundRect(ctx, qx - 12, qy - 12, qrSize + 24, qrSize + 24, 16); ctx.fill();
    ctx.fillStyle = '#ff2442';
    for (let r = 0; r < count; r++) for (let c = 0; c < count; c++) {
      if (qr.isDark(r, c)) ctx.fillRect(qx + c * qrCell, qy + r * qrCell, qrCell, qrCell);
    }
    // 右侧文案
    const tx = qx + qrSize + 44, tw = cardX + cardW - tx - fpad;
    let ty = fy + fpad;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#2b2b2b'; ctx.font = '800 40px ' + F;
    ctx.fillText('扫码测你的', tx, ty); ty += 52;
    ctx.fillText('相亲市场定位', tx, ty); ty += 72;
    ctx.fillStyle = '#555'; ctx.font = '28px ' + F;
    ctx.fillText('看你在婚恋市场', tx, ty); ty += 40;
    ctx.fillText('究竟站在什么位置', tx, ty); ty += 64;
    ctx.fillStyle = '#ff2442'; ctx.font = '700 28px ' + F;
    ctx.fillText('💝 嘀嗒老师', tx, ty); ty += 44;
    ctx.fillStyle = '#b0b0b0'; ctx.font = '22px ' + F;
    ctx.fillText('GGYJWA.github.io/dating-positioning', tx, ty);

    const totalH = fy + fH + 60;
    const out = document.createElement('canvas');
    out.width = W; out.height = totalH;
    const octx = out.getContext('2d');
    octx.drawImage(tmp, 0, 0, W, totalH, 0, 0, W, totalH);
    return out.toDataURL('image/png');
  }

  function ensureShareOverlay() {
    if (document.getElementById('shareOverlay')) return;
    const o = el(`<div class="share-overlay" id="shareOverlay">
      <div class="share-modal">
        <img class="share-img" id="shareImg" alt="分享图" />
        <p class="share-tip">长按图片可保存 · 也可点下方按钮下载</p>
        <div class="share-btns">
          <button class="ghost-btn" id="shareClose">关闭</button>
          <button class="primary-btn" id="shareDownload">💾 保存图片</button>
        </div>
      </div>
    </div>`);
    document.body.appendChild(o);
    o.addEventListener('click', (e) => { if (e.target === o) o.style.display = 'none'; });
    o.querySelector('#shareClose').addEventListener('click', () => { o.style.display = 'none'; });
    o.querySelector('#shareDownload').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = document.getElementById('shareImg').src;
      a.download = '相亲市场定位-嘀嗒老师.png';
      document.body.appendChild(a); a.click(); a.remove();
    });
  }

  function generateShareImage() {
    ensureShareOverlay();
    const btn = document.getElementById('shotBtn');
    const old = btn.textContent;
    btn.disabled = true; btn.textContent = '生成中…';
    setTimeout(() => {
      try {
        const url = buildShareDataURL();
        document.getElementById('shareImg').src = url;
        document.getElementById('shareOverlay').style.display = 'flex';
      } catch (err) {
        toast('分享图生成失败：' + err.message);
      }
      btn.disabled = false; btn.textContent = old;
    }, 30);
  }

  /* ---------- 提示 ---------- */
  let toastTimer;
  function toast(msg) {
    let t = document.getElementById('toast');
    if (!t) { t = el('<div id="toast" class="toast"></div>'); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  /* ---------- 渲染入口 ---------- */
  function render() {
    app.innerHTML = '';
    let node;
    if (state.step === 0) node = renderIntro();
    else if (state.step >= 1 && state.step <= 9) node = renderQuiz();
    else if (state.step === 10) node = renderLoading();
    else if (state.step === 11) node = renderResult();
    app.appendChild(node);
  }

  render();
})();
</script>
</body>
</html>
